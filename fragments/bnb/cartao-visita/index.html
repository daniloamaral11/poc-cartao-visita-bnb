<div class="bnb-wrap">
	<div class="bnb-card">
		<div class="bnb-card__bar"></div>

		<div class="bnb-card__body">
			<span class="bnb-card__brand">${configuration.marca}</span>

			<h2 class="bnb-card__nome" data-nome
				data-lfr-editable-id="nome"
				data-lfr-editable-type="text">Nome da Pessoa</h2>

			<p class="bnb-card__cargo" data-cargo
				data-lfr-editable-id="cargo"
				data-lfr-editable-type="text">Cargo</p>

			<p class="bnb-card__tel">
				<span data-telefone
					data-lfr-editable-id="telefone"
					data-lfr-editable-type="text">(85) 0000-0000</span>
			</p>

			<p class="bnb-card__mail" data-email
				data-lfr-editable-id="email"
				data-lfr-editable-type="text">email@bnb.gov.br</p>
		</div>

		<div class="bnb-card__stripe"></div>
	</div>

	<div class="bnb-actions">
		<button class="bnb-btn bnb-btn--primary" data-export type="button">Baixar PNG</button>
		<button class="bnb-btn bnb-btn--ghost" data-copy type="button">Copiar link</button>
		<span class="bnb-toast" data-toast hidden>Link copiado!</span>
	</div>
</div>
